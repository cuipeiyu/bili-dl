<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>bili-dl 设置</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #222; background: #fff; }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 16px; font-size: 13px; font-weight: 500; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; font-size: 13px; }
    button { margin-top: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 12px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>bili-dl 设置</h1>
  <label>服务地址（WebSocket）
    <input id="endpoint" placeholder="ws://192.168.1.10:18080">
  </label>
  <label>访问令牌
    <input id="token" type="password" placeholder="与 BILIDL_TOKEN 一致">
  </label>
  <button id="save">保存</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
